name: Permanent RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Persistent RDP Settings & Timeout Fixes
        run: |
          # Enable Remote Desktop and disable NLA/Security layer for easy connection
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          # Disable Session Timeouts to prevent automatic disconnection
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Name "MaxIdleTime" -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Name "MaxDisconnectionTime" -Value 0 -Force

          # Configure Firewall
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          # Restart RDP service
          Restart-Service -Name TermService -Force

      - name: Setup Permanent Local User
        env:
          CUSTOM_PASS: ${{ secrets.RDP_PASSWORD }}
        run: |
          $username = "PermanentRDP"
          $securePass = ConvertTo-SecureString $env:CUSTOM_PASS -AsPlainText -Force
          
          # Check if user already exists, if not create it
          if (-not (Get-LocalUser -Name $username -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name $username -Password $securePass -AccountNeverExpires -PasswordNeverExpires
          } else {
              Set-LocalUser -Name $username -Password $securePass
          }
          
          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Connect Tailscale with Fixed Hostname
        run: |
          # Using a fixed hostname 'gh-permanent-rdp' so Tailscale reuses or maps consistently
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-permanent-rdp --reset
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 15) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Failed to get Tailscale IP."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Display Permanent Connection Details
        run: |
          Write-Host "`n=========================================="
          Write-Host "       RDP CONNECTION READY               "
          Write-Host "=========================================="
          Write-Host " Tailscale IP : $env:TAILSCALE_IP"
          Write-Host " Hostname     : gh-permanent-rdp"
          Write-Host " Username     : PermanentRDP"
          Write-Host " Password     : (Secret configured in repo)"
          Write-Host "==========================================`n"

          # Keep alive loop to prevent runner shutdown
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Session Active..."
              Start-Sleep -Seconds 300
          }
